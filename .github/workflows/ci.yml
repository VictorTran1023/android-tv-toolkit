name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m compileall -q scripts

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Lint
        run: ruff check scripts

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify image references
        run: |
          set -e
          for f in README.md README.en.md; do
            grep -o 'docs/images/[^)]*' "$f" | while read -r img; do
              test -f "$img" || { echo "missing image: $img (in $f)"; exit 1; }
            done
          done
          echo "all image references resolved"
