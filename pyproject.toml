[project]
name = "android-tv-toolkit"
version = "0.2.0"
description = "Brand-agnostic Android TV toolkit: ADB authorization, per-brand sideloading, debloat with snapshots, HUD, regression tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

