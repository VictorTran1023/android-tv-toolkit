[project]
name = "tcl-tv-guide"
version = "0.1.0"
description = "TCL Android TV toolkit: ADB authorization, sideloading, proxy chain, playback tuning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
